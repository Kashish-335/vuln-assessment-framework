version: '3.8'

services:
  # Lab Target: OWASP Juice Shop
  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: lab-juice-shop
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - lab-network

  # Dynamic Application Security Testing (DAST): OWASP ZAP Daemon
  zap:
    image: zaproxy/zap-stable:latest
    container_name: lab-zap
    environment:
      - ZAP_API_KEY=${ZAP_API_KEY}
    command: >
      zap.sh -daemon
      -host 0.0.0.0
      -port 8090
      -config api.key=${ZAP_API_KEY}
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
    ports:
      - "8090:8090"
    restart: unless-stopped
    networks:
      - lab-network

networks:
  lab-network:
    driver: bridge
